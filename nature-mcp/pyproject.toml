[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nature-mcp"
version = "0.1.0"
description = "Nature/Science 学术检索 MCP：OpenAlex / Semantic Scholar / Crossref / Unpaywall"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.9,<2",
  "uvicorn>=0.30",
]

[project.scripts]
nature-mcp = "nature_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nature_mcp*"]
