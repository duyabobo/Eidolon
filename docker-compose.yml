version: "3.9"

services:
  # cm-server：合并原 gateway/gateway-sse/admin/llm-proxy/mcp-proxy 五个服务的单进程
  # FastAPI 应用（见 cm-server/README.md）。桌面单机场景不再需要按 QPS/并发连接数/
  # 下游调用量分别独立扩容，合并为一个进程、一个端口，减少子进程与端口管理复杂度。
  cm-server:
    build:
      context: .
      dockerfile: cm-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CM_SERVER_HOST: "0.0.0.0"
      CM_SERVER_PORT: "8000"
      TZ: "Asia/Shanghai"
      SANDBOX_ROOT: "/data/sandboxes"
      # pi-runtime 直连地址：任务派发（原 Redis Stream）与 cancel/close 控制信号（原 Redis Pub/Sub）
      PI_RUNTIME_BASE_URL: "http://pi-runtime:8090"
    ports:
      - "8000:8000"
    volumes:
      - ./logs/cm-server:/app/logs
      # 可读 Skill；对话附件需写入 users/{uid}/sessions/{sid}/workspace
      - sandbox_workspaces:/data/sandboxes
      # 本地 SQLite 单文件库（gateway/gateway-sse/admin/llm-proxy/mcp-proxy 的数据全部在这一个文件里）
      - sqlite_data:/data
    networks:
      - pi_net
    depends_on:
      arxiv-mcp:
        condition: service_healthy
      nature-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - pi_net
    depends_on:
      cm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  pi-runtime:
    build:
      context: ./pi-runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OPENAI_API_KEY: "pi-agent-internal"
      TZ: "Asia/Shanghai"
      SANDBOX_ROOT: "/data/sandboxes"
      # llm-proxy/mcp-proxy/gateway/gateway-sse 已合并进 cm-server 单进程单端口
      LLM_PROXY_HOST: "cm-server"
      LLM_PROXY_PORT: "8000"
      MCP_PROXY_HOST: "cm-server"
      MCP_PROXY_PORT: "8000"
      # 本机 HTTP 服务端口：接收 gateway 派发的任务与 cancel/close 控制信号（替代原 Redis Stream/Pub-Sub）
      PI_RUNTIME_PORT: "8090"
      # 反向调用 gateway（session 状态/events_snapshot/skill 列表）与 gateway-sse（推送增量事件）
      GATEWAY_BASE_URL: "http://cm-server:8000"
      GATEWAY_SSE_BASE_URL: "http://cm-server:8000"
      # bwrap 是否允许联网：true=可联网，false=不可联网
      SANDBOX_NETWORK_ENABLED: "${SANDBOX_NETWORK_ENABLED:-false}"
      # 每个 session 沙盒 cgroup 资源上限（cgroup v2；不可用时自动降级）
      SANDBOX_CGROUP_ENABLED: "true"
      SANDBOX_CGROUP_MEMORY_MAX: "512M"
      SANDBOX_CGROUP_CPU_MAX: "max"
    # bwrap 需要 user namespace，privileged 模式提供必要的内核能力
    privileged: true
    # 使用宿主机 cgroup 命名空间，便于解析真实 cgroup 路径（子 cgroup 仍需 Docker 委托控制器）
    cgroup: host
    volumes:
      # 共享持久化卷，完整挂载 /data/sandboxes 根目录：
      #   users/{uid}/workspace/  home/  skills/  sessions/ 
      #   global/skills/  ← admin 写入的全局 skill
      - sandbox_workspaces:/data/sandboxes
      - ./logs/pi-runtime:/app/logs
    ports:
      - "8090:8090"
    networks:
      - pi_net
    depends_on:
      cm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 平台内置 arXiv MCP（Streamable HTTP）；经 cm-server 内的 mcp-proxy 模块聚合，不进沙盒
  arxiv-mcp:
    build:
      context: .
      dockerfile: arxiv-mcp/Dockerfile
    restart: unless-stopped
    environment:
      TRANSPORT: "http"
      HOST: "0.0.0.0"
      PORT: "8081"
      ALLOWED_HOSTS: "arxiv-mcp,arxiv-mcp:8081,localhost,localhost:8081,127.0.0.1,127.0.0.1:8081"
      REQUEST_TIMEOUT: "120"
      LOG_DIR: "/app/logs"
      LOG_LEVEL: "INFO"
      TZ: "Asia/Shanghai"
    volumes:
      - arxiv_papers:/data/arxiv-papers
      - ./logs/arxiv-mcp:/app/logs
    networks:
      - pi_net

  # 平台内置 Nature/Science 学术检索 MCP（OpenAlex/S2/Crossref/Unpaywall；仅元数据+合法 OA）
  nature-mcp:
    build:
      context: .
      dockerfile: nature-mcp/Dockerfile
    restart: unless-stopped
    environment:
      TRANSPORT: "streamable-http"
      HOST: "0.0.0.0"
      PORT: "8082"
      ALLOWED_HOSTS: "nature-mcp,nature-mcp:8082,localhost,localhost:8082,127.0.0.1,127.0.0.1:8082"
      REQUEST_TIMEOUT: "60"
      LOG_DIR: "/app/logs"
      LOG_LEVEL: "INFO"
      TZ: "Asia/Shanghai"
      OPENALEX_EMAIL: "${OPENALEX_EMAIL:-nature-mcp@localhost}"
      UNPAYWALL_EMAIL: "${UNPAYWALL_EMAIL:-nature-mcp@localhost}"
      S2_API_KEY: "${S2_API_KEY:-}"
    volumes:
      - ./logs/nature-mcp:/app/logs
    networks:
      - pi_net

volumes:
  arxiv_papers:
  sandbox_workspaces:
  # 本地 SQLite 单文件库：cm-server 内合并的 gateway/gateway-sse/admin/llm-proxy/mcp-proxy
  # 五个模块共享同一份文件（同一份 SCHEMA_SQL，单进程单连接，见 cm-server/README.md）
  sqlite_data:

networks:
  pi_net:
    driver: bridge
