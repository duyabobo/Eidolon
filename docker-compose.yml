version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27019:27019"
    volumes:
      - mongo_data:/data/db
    networks:
      - pi_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - pi_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm-proxy:
    build:
      context: .
      dockerfile: llm-proxy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "9001"
      TZ: "Asia/Shanghai"
    ports:
      - "9001:9001"
    volumes:
      - ./logs/llm-proxy:/app/logs
    networks:
      - pi_net
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: "9000"
      TZ: "Asia/Shanghai"
      SANDBOX_ROOT: "/data/sandboxes"
      LLM_PROXY_BASE_URL: "http://llm-proxy:9001"
      MCP_PROXY_BASE_URL: "http://mcp-proxy:8080"
    ports:
      - "9000:9000"
    volumes:
      # admin 需要写 global skills 到共享文件系统
      - sandbox_workspaces:/data/sandboxes
      - ./logs/admin:/app/logs
    networks:
      - pi_net
    depends_on:
      mongo:
        condition: service_healthy
      llm-proxy:
        condition: service_healthy
      mcp-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8002"
      TZ: "Asia/Shanghai"
      SANDBOX_ROOT: "/data/sandboxes"
      MCP_PROXY_BASE_URL: "http://mcp-proxy:8080"
    ports:
      - "8002:8002"
    volumes:
      - ./logs/gateway:/app/logs
      # 可读 Skill；对话附件需写入 users/{uid}/sessions/{sid}/workspace
      - sandbox_workspaces:/data/sandboxes
    networks:
      - pi_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # gateway-sse：SSE 长连接服务，从 gateway 拆出的独立运行单元。
  # 长驻连接按"并发连接数"扩容，与 gateway 按"QPS"扩容的节奏不同，
  # 拆分后二者可分别调整副本数和资源上限，互不拖累。
  gateway-sse:
    build:
      context: .
      dockerfile: gateway-sse/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      GATEWAY_SSE_HOST: "0.0.0.0"
      GATEWAY_SSE_PORT: "8001"
      TZ: "Asia/Shanghai"
    ports:
      - "8001:8001"
    volumes:
      - ./logs/gateway-sse:/app/logs
    networks:
      - pi_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - pi_net
    depends_on:
      gateway:
        condition: service_healthy
      gateway-sse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  pi-runtime:
    build:
      context: ./pi-runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OPENAI_API_KEY: "pi-agent-internal"
      TZ: "Asia/Shanghai"
      SANDBOX_ROOT: "/data/sandboxes"
      LLM_PROXY_HOST: "llm-proxy"
      LLM_PROXY_PORT: "9001"
      MCP_PROXY_HOST: "mcp-proxy"
      MCP_PROXY_PORT: "8080"
      # bwrap 是否允许联网：true=可联网，false=不可联网
      SANDBOX_NETWORK_ENABLED: "${SANDBOX_NETWORK_ENABLED:-false}"
      # 每个 session 沙盒 cgroup 资源上限（cgroup v2；不可用时自动降级）
      SANDBOX_CGROUP_ENABLED: "true"
      SANDBOX_CGROUP_MEMORY_MAX: "512M"
      SANDBOX_CGROUP_CPU_MAX: "max"
    # bwrap 需要 user namespace，privileged 模式提供必要的内核能力
    privileged: true
    # 使用宿主机 cgroup 命名空间，便于解析真实 cgroup 路径（子 cgroup 仍需 Docker 委托控制器）
    cgroup: host
    volumes:
      # 共享持久化卷，完整挂载 /data/sandboxes 根目录：
      #   users/{uid}/workspace/  home/  skills/  sessions/ 
      #   global/skills/  ← admin 写入的全局 skill
      - sandbox_workspaces:/data/sandboxes
      - ./logs/pi-runtime:/app/logs
    networks:
      - pi_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-proxy:
        condition: service_healthy
      mcp-proxy:
        condition: service_healthy

  mcp-proxy:
    build:
      context: .
      dockerfile: mcp-proxy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_PROXY_PORT: "8080"
      TZ: "Asia/Shanghai"
    volumes:
      - ./logs/mcp-proxy:/app/logs
    networks:
      - pi_net
    depends_on:
      mongo:
        condition: service_healthy
      arxiv-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 平台内置 arXiv MCP（Streamable HTTP）；经 mcp-proxy 聚合，不进沙盒
  arxiv-mcp:
    build:
      context: .
      dockerfile: arxiv-mcp/Dockerfile
    restart: unless-stopped
    environment:
      TRANSPORT: "http"
      HOST: "0.0.0.0"
      PORT: "8081"
      ALLOWED_HOSTS: "arxiv-mcp,arxiv-mcp:8081,localhost,localhost:8081,127.0.0.1,127.0.0.1:8081"
      LOG_DIR: "/app/logs"
      LOG_LEVEL: "INFO"
      TZ: "Asia/Shanghai"
    volumes:
      - arxiv_papers:/data/arxiv-papers
      - ./logs/arxiv-mcp:/app/logs
    networks:
      - pi_net

volumes:
  mongo_data:
  redis_data:
  arxiv_papers:
  # 开发环境：local 驱动，数据在单机上。
  # 生产集群：用 docker-compose.prod.yml override，换为 NFS/EFS 驱动。
  sandbox_workspaces:

networks:
  pi_net:
    driver: bridge
