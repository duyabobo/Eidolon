  <text x="206" y="180" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#4338ca">你看到、点得到的界面</text>
  <text x="206" y="216" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#334155">聊天</text>
  <text x="206" y="242" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#334155">经验 · 工具 · 知识</text>
  <text x="206" y="268" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#334155">你的个人分身</text>
  <line x1="372" y1="198" x2="508" y2="198" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="508,198 492,190 492,206" fill="#94a3b8"/>
  <polygon points="372,198 388,190 388,206" fill="#94a3b8"/>
  <text x="440" y="184" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#64748b">你说 / 它回</text>
  <rect x="524" y="100" width="300" height="196" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="674" y="148" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" font-weight="700" fill="#065f46">本机服务</text>
