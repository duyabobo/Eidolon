server {
    listen 3000;

    # 知识库文档上传单文件 ≤ 10MB（含 multipart 开销）
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # React Router 支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 长连接 → gateway-sse（独立扩容单元，按连接数而非 QPS 伸缩）
    # 正则 location 优先级高于下面的 /sessions 前缀 location，必须匹配到这里
    location ~ ^/sessions/[^/]+/(turns/[^/]+/)?stream$ {
        proxy_pass http://gateway-sse:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE：禁止缓冲，拉长超时，避免执行中途断流
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        proxy_set_header X-Accel-Buffering no;
    }

    # 会话 CRUD / 任务派发 → gateway（短请求，按 QPS 扩容）
    location /sessions {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 对话维度聚合接口 → gateway
    location /conversations {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # skill 列表（对话页下拉用）→ gateway
    location /skills {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MCP 列表/个人 MCP CRUD → gateway
    location /mcp {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # LLM 配置由 llm-proxy 自身管理（含内存热更新），精确路由优先于 /config
    location /config/llm {
        proxy_pass http://llm-proxy:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 知识库文档 Wiki 深链：浏览器误开 API 路径时重定向至 SPA
    location ~ ^/config/knowledge/bases/([^/]+)/documents/([^/]+)$ {
        if ($http_accept ~* text/html) {
            return 302 /admin/knowledge/bases/$1/documents/$2;
        }
        proxy_pass http://admin:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MCP / Skill 等配置管理 API → admin
    # skill-creator 单轮会串行调多次 LLM（对话 + draft-sync，失败时再自我修正），
    # 常见 60–120s，nginx 默认 proxy_read_timeout=60s 会提前 504。
    location /config {
        proxy_pass http://admin:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://gateway:8000;
    }
}
