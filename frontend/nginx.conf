server {
    listen 3000;

    # 知识库文档上传单文件 ≤ 10MB（含 multipart 开销）
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS：proxy_pass 用变量时按请求解析，避免上游晚于 nginx 启动导致永久 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # cm-server 合并了原 gateway/gateway-sse/admin/llm-proxy/mcp-proxy，
    # 所有 API 路径现在都指向同一个上游，不再需要按路径拆分到不同服务。
    set $upstream_cm_server cm-server:8000;

    # React Router 支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 页面路径与 API 前缀同名（/skills、/mcp、/config）：
    # 浏览器直接打开或刷新时 Accept 含 text/html，回退到 index.html；
    # 前端 fetch 默认 Accept: */*，仍走下方 API 代理。
    location = /skills {
        if ($http_accept ~* text/html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://$upstream_cm_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /mcp {
        if ($http_accept ~* text/html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://$upstream_cm_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /config {
        if ($http_accept ~* text/html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://$upstream_cm_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 长连接：禁止缓冲，拉长超时，避免执行中途断流
    # 正则 location 优先级高于下面的 /sessions 前缀 location，必须匹配到这里
    location ~ ^/sessions/[^/]+/(turns/[^/]+/)?stream$ {
        proxy_pass http://$upstream_cm_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        proxy_set_header X-Accel-Buffering no;
    }

    # 知识库文档 Wiki 深链：浏览器误开 API 路径时重定向至 SPA
    location ~ ^/config/knowledge/bases/([^/]+)/documents/([^/]+)$ {
        if ($http_accept ~* text/html) {
            return 302 /admin/knowledge/bases/$1/documents/$2;
        }
        proxy_pass http://$upstream_cm_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # /config 下的 skill-creator 单轮会串行调多次 LLM（对话 + draft-sync，失败时再自我修正），
    # 常见 60–120s，nginx 默认 proxy_read_timeout=60s 会提前 504。
    location /config {
        proxy_pass http://$upstream_cm_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 会话 CRUD / 任务派发、对话聚合、skill 列表、MCP 列表、健康检查
    location ~ ^/(sessions|conversations|skills|mcp|health)($|/) {
        proxy_pass http://$upstream_cm_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
